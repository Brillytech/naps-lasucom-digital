    <style>
      /* ----------------------------------------------------------
         Splash. Shown until React mounts, then faded and removed
         by main.jsx. Deliberately quiet: a mark, a wordmark, a
         thin progress line, and the build credit anchored at the
         foot rather than crowded under the loader.
         ---------------------------------------------------------- */

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 32px 24px calc(28px + env(safe-area-inset-bottom, 0px));

        background:
          radial-gradient(circle at 22% 18%, rgba(77, 163, 255, 0.16), transparent 42%),
          radial-gradient(circle at 82% 84%, rgba(34, 164, 71, 0.13), transparent 44%),
          linear-gradient(168deg, #020a16 0%, #062b63 58%, #03152f 100%);

        color: #ffffff;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;

        transition: opacity 0.7s ease;
      }

      .splash-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
      }

      /* --- mark --- */
      .splash-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 168px;
        height: 168px;
      }

      /* Two hairline rings and a soft bloom, instead of a stack of
         coloured drop-shadows on the logo itself. */
      .splash-mark::before,
      .splash-mark::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.09);
        opacity: 0;
        transform: scale(0.94);
        transition: opacity 0.8s ease, transform 0.8s ease;
      }

      .splash-mark::before {
        width: 128px;
        height: 128px;
      }

      .splash-mark::after {
        width: 168px;
        height: 168px;
        border-color: rgba(255, 255, 255, 0.05);
        transition-delay: 0.1s;
      }

      #app-splash.show .splash-mark::before,
      #app-splash.show .splash-mark::after {
        opacity: 1;
        transform: scale(1);
      }

      .splash-glow {
        position: absolute;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(77, 163, 255, 0.22),
          transparent 68%
        );
        opacity: 0;
        transition: opacity 1s ease;
      }

      #app-splash.show .splash-glow {
        opacity: 1;
      }

      #splash-logo {
        position: relative;
        width: 96px;
        height: 96px;
        object-fit: contain;

        opacity: 0;
        transform: scale(0.92);
        transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.3, 1);
      }

      #app-splash.show #splash-logo {
        opacity: 1;
        transform: scale(1);
      }

      /* --- wordmark --- */
      #splash-extra {
        display: flex;
        flex-direction: column;
        align-items: center;

        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.6s ease 0.18s, transform 0.6s ease 0.18s;
      }

      #app-splash.show #splash-extra {
        opacity: 1;
        transform: none;
      }

      #splash-extra h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.1;
        color: #ffffff;
      }

      #splash-extra p {
        margin: 9px 0 0;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(159, 208, 255, 0.85);
      }

      /* --- progress --- */
      .loader {
        width: 104px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;

        opacity: 0;
        transition: opacity 0.5s ease 0.4s;
      }

      #app-splash.show .loader {
        opacity: 1;
      }

      .loader span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #4da3ff 42%, #22a447);
        animation: splash-sweep 1.15s cubic-bezier(0.5, 0, 0.4, 1) infinite;
      }

      @keyframes splash-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(370%);
        }
      }

      /* --- build credit, anchored at the foot --- */
      .splash-foot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;

        opacity: 0;
        transition: opacity 0.6s ease 0.6s;
      }

      #app-splash.show .splash-foot {
        opacity: 1;
      }

      .splash-foot-rule {
        width: 26px;
        height: 1px;
        background: rgba(255, 255, 255, 0.18);
        margin-bottom: 5px;
      }

      .splash-foot-label {
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.38);
      }

      .splash-foot-name {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.72);
      }

      @media (min-width: 700px) {
        #splash-logo {
          width: 116px;
          height: 116px;
        }

        .splash-mark {
          width: 200px;
          height: 200px;
        }

        .splash-mark::before {
          width: 152px;
          height: 152px;
        }

        .splash-mark::after {
          width: 200px;
          height: 200px;
        }

        #splash-extra h1 {
          font-size: 30px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash *,
        #app-splash *::before,
        #app-splash *::after {
          transition-duration: 0.01ms !important;
          animation: none !important;
        }

        .loader span {
          width: 100%;
        }
      }
    </style>
  </head>

 <body>

<div id="app-splash">

  </div>

  </div>
</div>
